<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabtify || Spotify Clone</title>
    <meta name="description" content="Sabtify - A beautiful Spotify clone music player with playlist support">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" href="./Library/favicon.svg" type="image/svg+xml">
</head>

<body>
    <!-- ===== LOADING SCREEN ===== -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loader-content">
            <!-- Animated music disc logo -->
            <div class="loader-disc">
                <svg class="loader-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Outer ring -->
                    <circle cx="60" cy="60" r="56" fill="none" stroke="url(#loaderGrad)" stroke-width="3"
                        opacity="0.3" />
                    <!-- Spinning ring -->
                    <circle cx="60" cy="60" r="56" fill="none" stroke="url(#loaderGrad)" stroke-width="3"
                        stroke-dasharray="88 264" stroke-linecap="round" class="loader-ring" />
                    <!-- Inner disc -->
                    <circle cx="60" cy="60" r="38" fill="#181818" />
                    <circle cx="60" cy="60" r="38" fill="url(#discGrad)" opacity="0.15" />
                    <!-- Grooves -->
                    <circle cx="60" cy="60" r="30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
                    <circle cx="60" cy="60" r="24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
                    <circle cx="60" cy="60" r="18" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
                    <!-- Center hole -->
                    <circle cx="60" cy="60" r="6" fill="#1db954" />
                    <circle cx="60" cy="60" r="3" fill="#121212" />
                    <!-- Music note -->
                    <g transform="translate(46, 42)" fill="none" stroke="#1db954" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round" class="loader-note">
                        <path d="M6 8v18c0 3-2.5 5-5.5 5S-2 29 0 27s3-2 6-2V8" />
                        <path d="M6 8c0-2 8-5 8-5v6s-8 3-8 5" />
                        <circle cx="22" cy="14" r="4" fill="none" stroke="#f472b6" stroke-width="2"
                            class="loader-note2" />
                    </g>
                    <!-- Gradient defs -->
                    <defs>
                        <linearGradient id="loaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1db954" />
                            <stop offset="100%" stop-color="#f472b6" />
                        </linearGradient>
                        <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#1db954" />
                            <stop offset="100%" stop-color="transparent" />
                        </radialGradient>
                    </defs>
                </svg>
            </div>
            <div class="loader-text">
                <span class="loader-brand">Sabtify</span>
                <span class="loader-dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Mobile Overlay (when sidebar is open) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-container" id="appContainer">
        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="logo-row">
                    <!-- New SVG Logo (click to reload) -->
                    <div class="logo-svg-wrap logo-clickable" id="logoClick" role="button" tabindex="0" aria-label="Home - Reload">
                        <svg class="logo-svg" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#1db954" />
                                    <stop offset="50%" stop-color="#1ed760" />
                                    <stop offset="100%" stop-color="#f472b6" />
                                </linearGradient>
                            </defs>
                            <circle cx="20" cy="20" r="18" fill="url(#logoGrad)" />
                            <!-- Sound waves -->
                            <rect x="11" y="16" width="3" height="8" rx="1.5" fill="white" class="wave-bar wave-1" />
                            <rect x="16" y="12" width="3" height="16" rx="1.5" fill="white"
                                class="wave-bar wave-2" />
                            <rect x="21" y="14" width="3" height="12" rx="1.5" fill="white"
                                class="wave-bar wave-3" />
                            <rect x="26" y="10" width="3" height="20" rx="1.5" fill="white"
                                class="wave-bar wave-4" />
                        </svg>
                    </div>
                    <span class="logo-text logo-clickable" id="logoText" role="button" tabindex="0" aria-label="Home">Sabtify</span>
                    <!-- Close button (mobile only) -->
                    <button class="sidebar-close" id="sidebarClose" aria-label="Close sidebar">
                        <img class="invert" src="./Library/img/close.svg" alt="Close">
                    </button>
                </div>
                <nav class="nav-links">
                    <a href="#" class="nav-link active" id="navHome" aria-label="Home">
                        <img class="invert" src="./Library/img/home.svg" alt="Home">
                        <span>Home</span>
                    </a>
                    <a href="#" class="nav-link" id="navSearch" aria-label="Search">
                        <img class="invert" src="./Library/img/search.svg" alt="Search">
                        <span>Search</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-library">
                <div class="library-header">
                    <img class="invert" src="./Library/img/playlist.svg" alt="Library">
                    <h2>Your Library</h2>
                </div>
                <div class="songList" id="songList">
                    <ul id="songListUL">
                        <!-- Songs injected by JS -->
                    </ul>
                </div>
            </div>

            <div class="sidebar-footer">
                <a href="https://www.spotify.com/jp/legal/">Legal</a>
                <a href="https://www.spotify.com/jp/privacy/">Privacy</a>
                <a href="https://www.spotify.com/jp/legal/privacy-policy/">Policy</a>
                <a href="https://www.spotify.com/jp/legal/cookies-policy/">Cookies</a>
                <a href="https://www.spotify.com/jp/accessibility/">Accessibility</a>
            </div>
        </aside>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main-content" id="mainContent">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <!-- Hamburger (mobile only) -->
                    <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
                        <img class="invert" src="./Library/img/hamburger.svg" alt="Menu">
                    </button>
                    <!-- Prev / Next Song arrows -->
                    <div class="nav-arrows">
                        <button class="arrow-btn" id="headerPrev" aria-label="Previous song">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M15 6l-6 6 6 6" />
                            </svg>
                        </button>
                        <button class="arrow-btn" id="headerNext" aria-label="Next song">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 6l6 6-6 6" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="header-right">
                    <button class="btn-signup" id="btnSignup">Sign Up</button>
                    <button class="btn-login" id="btnLogin">Log In</button>
                </div>
            </header>

            <!-- Playlist Section -->
            <section class="playlist-section">
                <h1 class="playlist-title">Sabtify Playlist</h1>
                <div class="card-container" id="cardContainer">
                    <!-- Cards injected by JS (shuffled on every load) -->
                </div>
            </section>
        </main>
    </div>

    <!-- ===== PLAYBAR (Fixed Bottom) ===== -->
    <div class="playbar" id="playbar">
        <!-- Song Info -->
        <div class="playbar-info">
            <img class="playbar-cover" id="playbarCover" src="./Library/img/cover.jpg" alt="Now Playing">
            <div class="playbar-text">
                <span class="playbar-song" id="playbarSong">Select a song</span>
            </div>
        </div>

        <!-- Center Controls -->
        <div class="playbar-controls">
            <div class="control-buttons">
                <button class="ctrl-btn" id="btnPrev" aria-label="Previous">
                    <img class="invert" src="./Library/img/prevsong.svg" alt="Previous">
                </button>
                <button class="ctrl-btn play-pause-btn" id="btnPlayPause" aria-label="Play/Pause">
                    <img class="invert" id="playPauseIcon" src="./Library/img/play.svg" alt="Play">
                </button>
                <button class="ctrl-btn" id="btnNext" aria-label="Next">
                    <img class="invert" src="./Library/img/nextsong.svg" alt="Next">
                </button>
            </div>
            <div class="seekbar-row">
                <span class="time-label" id="currentTime">00:00</span>
                <div class="seekbar" id="seekbar">
                    <div class="seekbar-fill" id="seekbarFill"></div>
                    <div class="seekbar-circle" id="seekbarCircle"></div>
                </div>
                <span class="time-label" id="totalTime">00:00</span>
            </div>
        </div>

        <!-- Volume -->
        <div class="playbar-volume">
            <button class="ctrl-btn volume-btn" id="btnVolume" aria-label="Toggle mute">
                <img class="invert" id="volumeIcon" src="./Library/img/volume.svg" alt="Volume">
            </button>
            <div class="volume-bar" id="volumeBar">
                <div class="volume-fill" id="volumeFill"></div>
                <div class="volume-circle" id="volumeCircle"></div>
            </div>
        </div>
    </div>

    <!-- ===== SEARCH MODAL ===== -->
    <div class="search-overlay" id="searchOverlay" role="dialog" aria-modal="true" aria-label="Search songs">
        <div class="search-modal">
            <div class="search-header">
                <div class="search-input-wrap">
                    <svg class="search-icon-svg" viewBox="0 0 24 24" width="20" height="20" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                    <input type="text" class="search-input" id="searchInput"
                        placeholder="Search for songs..." autocomplete="off" spellcheck="false">
                    <button class="search-clear" id="searchClear" aria-label="Clear search">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
                <button class="search-close-btn" id="searchClose" aria-label="Close search">Close</button>
            </div>
            <div class="search-results" id="searchResults">
                <p class="search-placeholder">Start typing to search songs...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
